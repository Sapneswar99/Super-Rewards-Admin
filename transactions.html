<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transactions — Super Rewards Admin</title>
  <meta name="description" content="All platform transactions">
  <meta name="robots" content="noindex, nofollow">

  <!-- FAVICON -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="theme-color" content="#0a0d14">

  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-app">

  <!-- ═══════════════════════════════════════
       TOP NAVBAR
       ═══════════════════════════════════════ -->
  <nav class="admin-navbar">
    <a href="index.html" class="admin-nav-brand">
      <span class="admin-nav-logo">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="48" fill="#7c3aed" opacity="0.18"/>
          <circle cx="50" cy="50" r="44" fill="#0a0d14" opacity="0.55"/>
          <circle cx="50" cy="50" r="40" fill="#0a0d14" opacity="0.85"/>
          <circle cx="50" cy="50" r="36" fill="#0a0d14"/>
          <circle cx="50" cy="50" r="34" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.15"/>
          <text x="50" y="68" text-anchor="middle"
                font-family="Arial Black, Arial, sans-serif"
                font-weight="900" font-size="52" fill="#ffffff">S</text>
        </svg>
      </span>
      <span class="admin-nav-title">
        <span class="admin-nav-title-main">Super Rewards</span>
        <span class="admin-nav-title-sub">Admin Panel</span>
      </span>
    </a>

    <div class="admin-nav-right">
      <span class="admin-user-badge" id="adminUserEmail">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Loading...</span>
      </span>
      <button id="adminLogoutBtn" class="admin-logout-btn" title="Logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span>Logout</span>
      </button>
    </div>
  </nav>

  <!-- ═══════════════════════════════════════
       MAIN CONTENT
       ═══════════════════════════════════════ -->
  <main class="admin-main">

    <!-- Page Header -->
    <div class="admin-page-header">
      <div>
        <h1 class="admin-page-title">Transactions</h1>
        <p class="admin-page-sub">Complete activity log of all users</p>
      </div>
      <div class="admin-refresh-btn" id="refreshBtn" title="Refresh data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </div>
    </div>

    <!-- ═══════════════════════════════════════
         STATS MINI GRID
         ═══════════════════════════════════════ -->
    <div class="admin-stats-grid admin-stats-grid-small">
      <div class="admin-stat-card">
        <div class="admin-stat-icon blue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
        </div>
        <div class="admin-stat-info">
          <div class="admin-stat-value" id="statTotalTx">—</div>
          <div class="admin-stat-label">Total Transactions</div>
        </div>
      </div>

      <div class="admin-stat-card">
        <div class="admin-stat-icon green">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
            <polyline points="17 6 23 6 23 12"/>
          </svg>
        </div>
        <div class="admin-stat-info">
          <div class="admin-stat-value" id="statCoinsEarned">—</div>
          <div class="admin-stat-label">Coins Earned</div>
        </div>
      </div>

      <div class="admin-stat-card">
        <div class="admin-stat-icon orange">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/>
            <polyline points="17 18 23 18 23 12"/>
          </svg>
        </div>
        <div class="admin-stat-info">
          <div class="admin-stat-value" id="statCoinsSpent">—</div>
          <div class="admin-stat-label">Coins Spent</div>
        </div>
      </div>

      <div class="admin-stat-card">
        <div class="admin-stat-icon purple">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>
        <div class="admin-stat-info">
          <div class="admin-stat-value" id="statTodayTx">—</div>
          <div class="admin-stat-label">Today</div>
        </div>
      </div>
    </div>

    <!-- ═══════════════════════════════════════
         SEARCH
         ═══════════════════════════════════════ -->
    <div class="admin-search-bar">
      <div class="admin-search-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          type="text"
          id="txSearchInput"
          placeholder="Search by user email, name, or type..."
          autocomplete="off">
      </div>
    </div>

    <!-- ═══════════════════════════════════════
         FILTER TABS
         ═══════════════════════════════════════ -->
    <div class="admin-filter-tabs">
      <button class="admin-filter-tab active" data-filter="all">
        <span class="admin-filter-label">All</span>
      </button>
      <button class="admin-filter-tab" data-filter="earned">
        <span class="admin-filter-label">Earned</span>
      </button>
      <button class="admin-filter-tab" data-filter="withdrawal">
        <span class="admin-filter-label">Withdrawals</span>
      </button>
      <button class="admin-filter-tab" data-filter="refund">
        <span class="admin-filter-label">Refunds</span>
      </button>
    </div>

    <!-- ═══════════════════════════════════════
         TRANSACTIONS LIST
         ═══════════════════════════════════════ -->
    <div class="admin-section">
      <div id="txList" class="admin-tx-list">

        <!-- Loading State -->
        <div class="admin-empty-state">
          <div class="admin-mini-spinner"></div>
          <p>Loading transactions...</p>
        </div>

      </div>

      <!-- Load More Button -->
      <div class="admin-load-more-wrap hidden" id="loadMoreWrap">
        <button class="admin-load-more-btn" id="loadMoreBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
          <span>Load More</span>
        </button>
      </div>

    </div>

  </main>

  <!-- ═══════════════════════════════════════
       BOTTOM NAVIGATION BAR (Mobile)
       ═══════════════════════════════════════ -->
  <nav class="admin-bottom-nav">
    <a href="index.html" class="admin-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"/>
        <rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/>
      </svg>
      <span>Dashboard</span>
    </a>

    <a href="withdrawals.html" class="admin-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="20" height="12" rx="2"/>
        <path d="M2 10h20"/>
        <circle cx="12" cy="14" r="1.5" fill="currentColor"/>
      </svg>
      <span>Withdrawals</span>
      <span class="admin-nav-badge" id="navPendingBadge">0</span>
    </a>

    <a href="users.html" class="admin-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span>Users</span>
    </a>

    <a href="transactions.html" class="admin-nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      <span>History</span>
    </a>
  </nav>

  <!-- Loading Overlay -->
  <div id="adminLoading" class="admin-loading hidden">
    <div class="admin-loading-spinner"></div>
    <p class="admin-loading-text">Loading...</p>
  </div>

  <script type="module" src="js/transactions.js"></script>

</body>
</html>
