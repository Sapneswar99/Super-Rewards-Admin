<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Super Rewards</title>
  <meta name="description" content="Super Rewards Admin Panel">
  <meta name="robots" content="noindex, nofollow">

  <!-- FAVICON -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="theme-color" content="#0a0d14">

  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-login-page">

  <div class="admin-login-wrap">

    <!-- LOGO / BRAND -->
    <div class="admin-login-brand">
      <div class="admin-logo-icon">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="48" fill="#7c3aed" opacity="0.18"/>
          <circle cx="50" cy="50" r="44" fill="#0a0d14" opacity="0.55"/>
          <circle cx="50" cy="50" r="40" fill="#0a0d14" opacity="0.85"/>
          <circle cx="50" cy="50" r="36" fill="#0a0d14"/>
          <circle cx="50" cy="50" r="34" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.15"/>
          <text x="50" y="68" text-anchor="middle"
                font-family="Arial Black, Arial, sans-serif"
                font-weight="900" font-size="52" fill="#ffffff">S</text>
        </svg>
      </div>
      <h1 class="admin-login-title">Super Rewards</h1>
      <span class="admin-badge">⚙️ Admin Panel</span>
    </div>

    <!-- LOGIN CARD -->
    <div class="admin-login-card">

      <h2 class="admin-login-heading">Welcome Back</h2>
      <p class="admin-login-sub">Sign in to access admin controls</p>

      <form id="adminLoginForm" class="admin-login-form" autocomplete="on">

        <!-- Email -->
        <div class="admin-input-group">
          <label for="adminEmail">Admin Email</label>
          <div class="admin-input-wrap">
            <span class="admin-input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
            </span>
            <input
              type="email"
              id="adminEmail"
              name="email"
              placeholder="admin@example.com"
              autocomplete="email"
              required>
          </div>
        </div>

        <!-- Password -->
        <div class="admin-input-group">
          <label for="adminPassword">Password</label>
          <div class="admin-input-wrap">
            <span class="admin-input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              type="password"
              id="adminPassword"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required>
            <button type="button" class="admin-toggle-password" data-target="adminPassword" aria-label="Show password">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Error / Success -->
        <p class="admin-error" id="adminLoginError"></p>
        <p class="admin-success" id="adminLoginSuccess"></p>

        <!-- Submit Button -->
        <button type="submit" class="admin-login-btn" id="adminLoginBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          <span>Sign In to Admin Panel</span>
        </button>

      </form>

      <!-- Security Notice -->
      <div class="admin-security-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>Authorized personnel only. All access is logged.</span>
      </div>

    </div>

    <!-- Footer -->
    <div class="admin-login-footer">
      <p>© 2026 Super Rewards • Admin Access Only</p>
      <a href="../Super-Rewards/" class="admin-back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        Back to User Site
      </a>
    </div>

  </div>

  <!-- Loading Overlay -->
  <div id="adminLoading" class="admin-loading hidden">
    <div class="admin-loading-spinner"></div>
    <p class="admin-loading-text">Verifying credentials...</p>
  </div>

  <!-- Script -->
  <script type="module" src="js/auth.js"></script>

</body>
</html>
